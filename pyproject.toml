[project]
name = "colony-orders"
version = "0.4.0"
description = "Orders, users, and payment reconciliation for the Colony storefront."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic[email]>=2.6",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:Warning"]

[tool.ruff]
line-length = 100
